name: CI
on:
  push:
    paths:
      - src/**
      - tests/**
      - Cargo.lock
      - Cargo.toml
    branches:
      - main
  pull_request:
    paths:
      - src/**
      - tests/**
      - Cargo.lock
      - Cargo.toml
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: ${{ env.ACTION_CACHE_PATH }}
          key: ${{ runner.os }}
      - run: cargo test
      - run: cargo build
